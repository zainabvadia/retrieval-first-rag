<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent Service</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --border: #2a2f3d;
    --text: #e8e9ed;
    --muted: #8b8fa3;
    --accent: #7c5cff;
    --accent-soft: rgba(124, 92, 255, 0.15);
    --tool-bg: #1c2433;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 20px;
    min-height: 100vh;
  }
  .app {
    width: 100%;
    max-width: 720px;
  }
  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px 0;
  }
  .subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .chat-window {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    min-height: 320px;
    max-height: 480px;
    overflow-y: auto;
    padding: 20px;
    margin-bottom: 16px;
  }
  .message {
    margin-bottom: 18px;
  }
  .message-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .message-content {
    font-size: 15px;
    line-height: 1.5;
  }
  .user-msg .message-content {
    background: var(--accent-soft);
    padding: 10px 14px;
    border-radius: 10px;
    display: inline-block;
  }
  .tool-trace {
    background: var(--tool-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-top: 8px;
    font-size: 13px;
    font-family: 'SF Mono', Consolas, monospace;
  }
  .tool-trace .tool-name {
    color: var(--accent);
    font-weight: 600;
  }
  .tool-trace .tool-detail {
    color: var(--muted);
    margin-top: 4px;
  }
  .input-row {
    display: flex;
    gap: 10px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 10px;
    padding: 0 22px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .examples {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .example-chip {
    background: var(--tool-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
  }
  .example-chip:hover {
    border-color: var(--accent);
    color: var(--text);
  }
  .loading {
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="app">
  <h1>Agent Service</h1>
  <div class="subtitle">An AI agent with real tool-calling — calculator, unit converter, knowledge base search</div>

  <div class="chat-window" id="chatWindow"></div>

  <div class="input-row">
    <input type="text" id="messageInput" placeholder="Ask something that needs a tool, e.g. 'What is 340 * 12?'" />
    <button id="sendBtn" onclick="sendMessage()">Send</button>
  </div>

  <div class="examples">
    <div class="example-chip" onclick="fillExample('What is 340 times 12, plus 50?')">Math question</div>
    <div class="example-chip" onclick="fillExample('Convert 25 kg to lbs')">Unit conversion</div>
    <div class="example-chip" onclick="fillExample('What is the expense approval limit?')">Policy question</div>
  </div>
</div>

<script>
const API_URL = "http://localhost:8000/agent";
const chatWindow = document.getElementById('chatWindow');
const messageInput = document.getElementById('messageInput');
const sendBtn = document.getElementById('sendBtn');

function fillExample(text) {
  messageInput.value = text;
  messageInput.focus();
}

function addMessage(label, content, className) {
  const div = document.createElement('div');
  div.className = `message ${className}`;
  div.innerHTML = `<div class="message-label">${label}</div><div class="message-content">${content}</div>`;
  chatWindow.appendChild(div);
  chatWindow.scrollTop = chatWindow.scrollHeight;
  return div;
}

async function sendMessage() {
  const message = messageInput.value.trim();
  if (!message) return;

  addMessage('You', message, 'user-msg');
  messageInput.value = '';
  sendBtn.disabled = true;

  const loadingDiv = addMessage('Agent', '<span class="loading">Thinking...</span>', 'agent-msg');

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message }),
    });

    if (!response.ok) throw new Error(`Server returned ${response.status}`);

    const data = await response.json();

    let toolHtml = '';
    if (data.tool_calls && data.tool_calls.length > 0) {
      toolHtml = data.tool_calls.map(tc => `
        <div class="tool-trace">
          <div class="tool-name">🔧 ${tc.tool}</div>
          <div class="tool-detail">Input: ${JSON.stringify(tc.input)}</div>
          <div class="tool-detail">Result: ${tc.result}</div>
        </div>
      `).join('');
    }

    loadingDiv.innerHTML = `<div class="message-label">Agent</div><div class="message-content">${data.answer}${toolHtml}</div>`;
  } catch (err) {
    loadingDiv.innerHTML = `<div class="message-label">Agent</div><div class="message-content" style="color:#ff6b6b">Error connecting to the agent service. Is it running on localhost:8000? (${err.message})</div>`;
  } finally {
    sendBtn.disabled = false;
  }
}

messageInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
